<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvas Website</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="main">
      <nav class="toolbar">
        <ul class="toolbar-list">
          <li>
            <button class="toolbar-btn">
              <img src="./icons/icons8-pen-50.png" alt="pen" />
            </button>
          </li>
          <li>
            <button class="toolbar-btn">
              <img src="./icons/icons8-highlighter-50.png" alt="highlighter" />
            </button>
          </li>
          <li>
            <button class="toolbar-btn">
              <img src="./icons/icons8-erase-50.png" alt="erase" />
            </button>
          </li>
          <li>
            <button class="toolbar-btn">
              <img src="./icons/icons8-sheet-32.png" alt="Sticky Note" />
            </button>
          </li>
        </ul>
      </nav>
      <section class="workspace">
        <div class="canvas-container">
          <canvas id="canvas" width="1400" height="1400"></canvas>
        </div>
      </section>
    </main>

    <script src="./index.js"></script>
  </body>
</html>
